name: TM Auto-Update

on:
  push:
    branches: [ main ]
    paths:
      # Re-run when CanIf source changes
      - 'OpenSAR/communication/CanIf/**'
      # Re-run when requirements change
      - 'Requirments/**'
      - 'Traceability-Matrix/TM-to-json/REQ-CODE-TM.json'
      # Re-run when the pipeline itself changes
      - 'tm_pipeline/**'
      - 'tm_config.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'OpenSAR/communication/CanIf/**'
      - 'Requirments/**'
      - 'tm_pipeline/**'

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: incremental
        type: choice
        options:
          - incremental
          - full

jobs:
  update-tm:
    name: Update Traceability Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated TM files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for incremental change detection

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_tm.txt

      - name: Install dependencies
        run: pip install -r requirements_tm.txt

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            # Use incremental when state file exists; full otherwise
            if [ -f "Traceability-Matrix/tm_state.json" ]; then
              echo "mode=incremental" >> $GITHUB_OUTPUT
            else
              echo "mode=full" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run TM pipeline (${{ steps.mode.outputs.mode }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m tm_pipeline \
            --config tm_config.yaml \
            --mode ${{ steps.mode.outputs.mode }} \
            --log INFO

      - name: Validate generated TM
        run: |
          python -m tm_pipeline \
            --config tm_config.yaml \
            --mode validate \
            --log WARNING

      - name: Commit updated TM files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(tm): auto-update traceability matrix [skip ci]"
          file_pattern: |
            Traceability-Matrix/AUTO-REQ-CODE-TM.md
            Traceability-Matrix/AUTO-Unmapped-REQ.md
            Traceability-Matrix/tm_report.json
            Traceability-Matrix/tm_review_queue.md
            Traceability-Matrix/tm_state.json
          commit_user_name: tm-bot
          commit_user_email: tm-bot@users.noreply.github.com

  # ── Separate validate-only job for PRs (read-only, no commit) ────────────────
  validate-pr:
    name: Validate TM (PR check)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_tm.txt

      - name: Install dependencies
        run: pip install -r requirements_tm.txt

      - name: Validate existing TM report
        run: |
          python -m tm_pipeline \
            --config tm_config.yaml \
            --mode validate \
            --log INFO
